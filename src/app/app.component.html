<header class="app-header">
  <a class="brand" routerLink="/overview">Event Horizon<span>People workspace</span></a>
  <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="main-navigation">Menu</button>
  <nav id="main-navigation" aria-label="Main navigation" [class.open]="menuOpen">
    <a routerLink="/overview" routerLinkActive="selected" (click)="menuOpen = false">Overview</a>
    <a routerLink="/people" routerLinkActive="selected" (click)="menuOpen = false">People</a>
    <a routerLink="/about" routerLinkActive="selected" (click)="menuOpen = false">About</a>
  </nav>
</header>
<main id="main-content"><router-outlet></router-outlet></main>
<footer>Event Horizon + Epsilon · Browser-local workspace</footer>
